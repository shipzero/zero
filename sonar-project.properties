# SonarQube analysis of the whole repo. Run from the repo root:
#   npx @sonar/scan -Dsonar.host.url=<server> -Dsonar.token=<token>
# The ratings were measured with the quality profile "Sonar way extended" for
# ts and js. The profile is assigned on the server, not in this file.

sonar.projectKey=zero
sonar.projectName=zero

sonar.sources=src,cli/src,shared
sonar.tests=src,cli/src
sonar.test.inclusions=**/*.test.ts
sonar.exclusions=**/*.test.ts

# Rules that do not hold for this codebase. Each entry names its reason.
sonar.issue.ignore.multicriteria=path

# zero drives the tools of its host: the server runs `docker compose`, the CLI
# runs `ssh` and looks up its own binary. Resolving them through PATH is the
# point - a pinned absolute path would break on every other install layout.
sonar.issue.ignore.multicriteria.path.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.path.resourceKey=**/*.ts
